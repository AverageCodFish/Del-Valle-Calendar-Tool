

<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Day Entry/Editing</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="delCSS.css"> 
    </head>
<body>
    <h1>Here, You Can Make Edits To The School Calender</h1>
    <main>

        <style>
            table { border-collapse: collapse; }
            td {
                width: 50px;
                height: 50px;
                text-align: center;
                border: 1px solid #444;
                cursor: pointer;
            }
            .green { background-color: #7CFF7C; }
            .red { background-color: #FF7C7C; }
        </style>
        <h2>AJAX Color-Coded Toggle Table</h2>

        <table id="grid">
            {% for r in range(states|length) %}
            <tr>
                {% for c in range(states[r]|length) %}
                <td class="{{ 'green' if states[r][c] else 'red' }}"
                    data-row="{{ r }}" data-col="{{ c }}">
                    {{ "YES" if states[r][c] else "NO" }}
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                document.querySelectorAll("#grid td").forEach(cell => {
                    cell.onclick = async () => {
                        const r = cell.dataset.row;
                        const c = cell.dataset.col;

                        // Send AJAX request to toggle
                        const response = await fetch("/toggle", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ row: r, col: c })
                        });

                        const result = await response.json();

                        // Update UI based on new state
                        const isGreen = result.new_state;

                        cell.classList.remove("green", "red");
                        cell.classList.add(isGreen ? "green" : "red");

                        cell.textContent = isGreen ? "YES" : "NO";
                    };
                });
            });
        </script>


        <a href="/">Go Back</a>
    </main>
