<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/delCSS.css">
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post">
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            autofocus
        >

        <button type="submit">Log In</button>
    </form>
</div>

</body>
</html>
